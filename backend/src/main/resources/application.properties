spring.application.name=supportiq
server.port=${PORT:${SERVER_PORT:8080}}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/supportiq}
spring.datasource.username=${DB_USERNAME:supportiq}
spring.datasource.password=${DB_PASSWORD:supportiq_dev_password}
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=none
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
spring.lifecycle.timeout-per-shutdown-phase=30s
app.gemini.model=${GEMINI_MODEL:gemini-3.8-flash}
app.gemini.url=https://generativelanguage.googleapis.com/v1beta/models
app.gemini.api-key=${GEMINI_API_KEY:}
app.ai.embedding-provider=${EMBEDDING_PROVIDER:gemini}
app.ai.embedding-api-key=${GEMINI_EMBEDDING_API_KEY:${GEMINI_API_KEY:}}
app.ai.embedding-model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-2}
app.ai.embedding-dimensions=768
app.ai.chunk-size=${RAG_CHUNK_SIZE:1800}
app.ai.chunk-overlap=${RAG_CHUNK_OVERLAP:240}
app.ai.max-upload-bytes=10485760
app.ai.processing.dispatch-locally=${AI_PROCESSING_DISPATCH_LOCALLY:true}
app.ai.worker.enabled=${AI_WORKER_ENABLED:false}
app.ai.worker.poll-ms=${AI_WORKER_POLL_MS:5000}
app.ai.worker.stale-minutes=${AI_WORKER_STALE_MINUTES:30}
app.cors.origin=${FRONTEND_ORIGIN:http://localhost:5173}
app.security.jwt-secret=${SUPPORTIQ_JWT_SECRET:}
app.security.access-minutes=${ACCESS_TOKEN_MINUTES:10}
app.security.refresh-days=${REFRESH_TOKEN_DAYS:14}
app.security.cookie-secure=${AUTH_COOKIE_SECURE:true}
app.security.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.security.local-link-exposure=${LOCAL_AUTH_LINK_EXPOSURE:false}
app.demo.admin-email=${DEMO_ADMIN_EMAIL:}
app.demo.admin-password=${DEMO_ADMIN_PASSWORD:}
app.demo.admin-name=${DEMO_ADMIN_NAME:ShopSmart Demo Admin}
app.demo.seed-admin=${SEED_DEMO_ADMIN:false}
app.payments.provider=${PAYMENT_PROVIDER:DEMO}
app.payments.live-enabled=${PAYMENT_LIVE_ENABLED:false}
app.payments.webhook-secret=${PAYMENT_WEBHOOK_SECRET:local-demo-webhook-secret-change-before-deploy}
app.billing.mode=${BILLING_PROVIDER:DEMO}
app.billing.webhook-secret=${BILLING_WEBHOOK_SECRET:local-demo-billing-secret-change-before-deploy}
app.billing.grace-days=${BILLING_GRACE_DAYS:7}
app.platform.super-admin-email=${SUPER_ADMIN_EMAIL:}
app.platform.super-admin-password=${SUPER_ADMIN_PASSWORD:}
app.platform.super-admin-name=${SUPER_ADMIN_NAME:SupportIQ Platform Admin}
